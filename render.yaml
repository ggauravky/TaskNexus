services:
  - type: web
    name: tasknexus-942u
    env: node
    region: oregon  # change if you need another region
    plan: starter
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/ready
    maxShutdownDelaySeconds: 30
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_ORIGIN
        value: https://task-nexus-official.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://task-nexus-official.vercel.app
      - key: REFRESH_COOKIE_SAME_SITE
        value: none
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: UPLOAD_STORAGE_MODE
        value: gridfs
      - key: GRIDFS_BUCKET_NAME
        value: tasknexus_attachments_production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      - key: EMAIL_ENABLED
        value: true
      - key: EMAIL_APP_NAME
        value: TaskNexus
      - key: BREVO_SMTP_HOST
        value: smtp-relay.brevo.com
      - key: BREVO_SMTP_PORT
        value: 587
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_PASS
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: TaskNexus
      - key: BREVO_REPLY_TO_EMAIL
        sync: false
      - key: BREVO_REPLY_TO_NAME
        value: TaskNexus Support
      - key: EMAIL_APP_URL
        value: https://task-nexus-official.vercel.app
      - key: EMAIL_SUPPORT_URL
        value: https://task-nexus-official.vercel.app
      - key: EMAIL_MAX_ATTEMPTS
        value: 3
      - key: EMAIL_RETRY_BASE_MS
        value: 1000
      - key: BREVO_ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
